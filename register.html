<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Amjad</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <!-- Register CSS -->
    <link rel="stylesheet" href="register.css">
</head>

<body>

    <!-- Animated Background -->
    <div class="animated-background">

        <div class="bg-orb orb-one"></div>
        <div class="bg-orb orb-two"></div>
        <div class="bg-orb orb-three"></div>

        <div class="bg-glow glow-one"></div>
        <div class="bg-glow glow-two"></div>

    </div>


    <!-- Register Container -->
    <main class="register-container">

        <div class="register-card">

            <!-- Logo -->
            <a href="index.html" class="logo">
                <span class="logo-name">AMJAD</span>
                <span class="logo-dot">.</span>
            </a>


            <!-- Heading -->
            <div class="register-header">

                <h1>Create Account</h1>

                <p>
                    Create your account to access your portfolio dashboard.
                </p>

            </div>


            <!-- Register Form -->
            <form id="registerForm" class="register-form">

                <!-- Full Name -->
                <div class="form-group">

                    <label for="registerName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="registerName"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="registerEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            id="togglePassword"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- Confirm Password -->
                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            id="toggleConfirmPassword"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- Terms -->
                <label class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <span>
                        I agree to the terms and conditions.
                    </span>

                </label>


                <!-- Message -->
                <div id="registerMessage" class="register-message"></div>


                <!-- Register Button -->
                <button
                    type="submit"
                    class="register-btn"
                >
                    Create Account
                    <span>→</span>
                </button>

            </form>


            <!-- Login Link -->
            <div class="login-link">

                <span>Already have an account?</span>

                <a href="login.html">
                    Login
                </a>

            </div>


            <!-- Back -->
            <a href="index.html" class="back-home">
                ← Back to Portfolio
            </a>

        </div>

    </main>


    <!-- Register JavaScript -->
    <script src="auth.js"></script>

</body>
</html>
